name: Unified repository validation

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF validation dependency
        run: python -m pip install pypdf==6.10.0 jsonschema==4.23.0

      - name: Validate unified source, registry, and documentation
        shell: bash
        run: |
          if test -f tools/validate_r52_successor.py; then
            python tools/validate_r52_successor.py --verify-frozen-core
            exit $?
          fi
          if test -f tools/validate_r51_successor.py; then
            python tools/validate_r51_successor.py --verify-frozen-core
            exit $?
          fi
          if test -f tools/validate_r50_successor.py; then
            python tools/validate_r50_successor.py --verify-frozen-core
            exit $?
          fi
          if test -f tools/validate_r49_successor.py; then
            python tools/validate_r49_successor.py --verify-frozen-core
            exit $?
          fi
          if test -f tools/validate_standalone_supplements.py; then
            python tools/validate_standalone_supplements.py --verify-frozen-core
            exit $?
          fi
          release_receipt="$(python -c 'from tools.validate_unified_repository import CURRENT_RELEASE_RECEIPT; print(CURRENT_RELEASE_RECEIPT)')"
          direct_ready=false
          if test -f validation/direct-successor-current.json; then
            direct_ready="$(python -c 'import json; from pathlib import Path; d=json.loads(Path("validation/direct-successor-current.json").read_text()); print(str(d.get("schema")=="unofficial-ai-integrated-stacks-direct-release-index/v1" and d.get("status")=="READY_FOR_PUBLICATION").lower())')"
          fi
          if test "${GITHUB_EVENT_NAME}" = push \
            && test "${GITHUB_REF}" = refs/heads/main \
            && test "${direct_ready}" != true \
            && test -f "${release_receipt}"; then
            python tools/validate_unified_repository.py
          else
            python tools/validate_unified_repository.py --pre-publication
          fi

      - name: Verify the generated upstream-change interface
        shell: bash
        run: |
          python tools/generate_possible_fix_patches.py --check
          python tools/export_upstream_corrections.py --check
          python -m unittest tests.test_upstream_correction_export
          python -m unittest tests.test_r49_successor
          python -m unittest tests.test_r50_successor
          python -m unittest tests.test_r51_successor tests.test_errata_build_diagnostics
          python -m unittest tests.test_r52_successor tests.test_legacy_context_replay
          python pursuing-stacks/check.py
          python pursuing-stacks/check.py --record intervals-integration.json
          python -m unittest tests.test_standalone_supplements
          python tools/generate_changes_from_upstream.py --check
          python -m unittest tests.test_changes_from_upstream tests.test_semantic_composition tests.test_build_fixed_point_mutex tests.test_compare_fixed_point_builds tests.test_r47_composition tests.test_r47_release_consumer
          python -m unittest discover -s tools -p 'test_*direct_successor*.py'
          python -m unittest discover -s tools -p 'test_tex_process_public_receipt.py'
          python -m unittest tests.test_tex_process_guard tests.test_r48_visual_loci tests.test_r48_synctex_instrumentation tests.test_direct_successor_pdf_package
          python -m unittest discover -s tools -p 'test_ai_source_correction*.py'
          python -m unittest discover -s tools/tests -p 'test_*ai_source_correction.py'
          python -m unittest discover -s tools -p 'test_cumulative_packaging.py'

  ega-checkpoint-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind historical EGA checks separately from later corrections
        shell: bash
        run: |
          echo "EGA_CHECKPOINT_DIR=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          if test -f validation/r51-successor-current.json; then
            base="cf3f3a85ccf0ac433524c7a075a1e9b267f49fe7"
            python -c 'import json; from pathlib import Path; d=json.loads(Path("validation/r51-successor-current.json").read_bytes()); assert d["previous_public"] == "cf3f3a85ccf0ac433524c7a075a1e9b267f49fe7"'
            git merge-base --is-ancestor "${base}" HEAD
            # The EGA evidence, checker, boundary tools and tests must remain
            # byte-identical. Never silently freeze a newly changed EGA lane.
            git diff --exit-code "${base}" HEAD -- ega ':(glob)tests/test_ega*' ':(glob)tools/*ega*'
            # Historical receipts describe their own input bytes. Current R51
            # source bytes and all 33 admitted operations are checked separately
            # by validate_r51_successor.py --verify-frozen-core in the other job.
            checkpoint="${RUNNER_TEMP}/ega-historical-checkpoint-r51"
            git worktree add --detach "${checkpoint}" "${base}"
            echo "EGA_CHECKPOINT_DIR=${checkpoint}" >> "${GITHUB_ENV}"
          fi

      - name: Verify EGA checkpoint, build binding, and preservation tooling
        working-directory: ${{ env.EGA_CHECKPOINT_DIR }}
        shell: bash
        run: |
          python ega/check.py
          python -m unittest discover -s tests -p 'test_ega_i_*_semantic.py'
          python -m unittest tests.test_ega_raw_source_boundaries tests.test_ega_i_713_source_boundaries
          python tools/check_ega_i713_source_boundaries.py
          python -m unittest tests.test_ega_i_719_source_boundaries
          python tools/check_ega_i719_source_boundaries.py
          python -m unittest tests.test_ega_i_711014_source_boundaries
          python tools/check_ega_i711014_source_boundaries.py
          python -m unittest tests.test_ega_i_711516_source_boundaries
          python tools/check_ega_i711516_source_boundaries.py
          python -m unittest tests.test_ega_i_724_source_boundaries
          python tools/check_ega_i724_source_boundaries.py
          python -m unittest tests.test_ega_i_727_source_boundaries
          python tools/check_ega_i727_source_boundaries.py
          python -m unittest tests.test_ega_i_729_source_boundaries
          python tools/check_ega_i729_source_boundaries.py
          python -m unittest tests.test_ega_i_734_source_boundaries
          python tools/check_ega_i734_source_boundaries.py
          python -m unittest tests.test_ega_i_737_source_boundaries
          python tools/check_ega_i737_source_boundaries.py
          python -m unittest tests.test_ega_i_738_source_boundaries
          python tools/check_ega_i738_source_boundaries.py
          python -m unittest tests.test_ega_i_74_source_boundaries
          python tools/check_ega_i74_source_boundaries.py
          python -m unittest \
            tests.test_ega_source_checkpoint \
            tests.test_ega_source_build_binding \
            tests.test_ega_source_package \
            tests.test_ega_checkpoint_successor
